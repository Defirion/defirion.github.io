<title id="daily-gold-title">Daily change in recorded gold holdings</title><desc id="daily-gold-desc">Gold change between consecutive observed UTC days. Gold includes wallets and the warband bank. Missing comparisons have hollow marks. Balance changes include spending and transfers.</desc><style>svg{background:#080909;font-family:Segoe UI,Arial,sans-serif}
.chart-grid{stroke:#514631;stroke-dasharray:3 7;fill:none}.chart-axis{fill:#a2a6a2;font-size:15px}
.chart-path{stroke:#e6c582;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart-point,.chart-positive{fill:#e6c582}.chart-negative{fill:#b9a5d2}.chart-gap{stroke:#a2a6a2;stroke-width:2;fill:none}
.chart-zero{stroke:#a2a6a2;fill:none}.chart-fill{fill:#e6c582;opacity:.055}</style>
